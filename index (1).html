<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="10 道是非题，测一测你在 AI 时代的分配权位置。">
<title>AI这轮，你拿到分配权了吗？</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% -10%, #3a1d6e 0%, #120b24 45%, #07050f 100%);
    color: #f4f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }
  .kicker { font-size: 12px; letter-spacing: 4px; color: #b79bff; margin: 0 0 8px; }
  h1 {
    font-size: 30px; line-height: 1.25; margin: 0 0 10px;
    background: linear-gradient(90deg, #ffd27a, #ff7ad9, #7ac7ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #a89cc9; font-size: 14px; line-height: 1.7; margin: 0 0 24px; }
  .panel {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(183,155,255,0.25);
    border-radius: 20px; padding: 22px;
  }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: #a89cc9; margin-bottom: 10px; }
  .meta b { color: #ffd27a; font-size: 15px; }
  .bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd27a, #ff7ad9); transition: width 0.35s ease; }
  .question { font-size: 19px; line-height: 1.6; min-height: 96px; margin: 0 0 24px; font-weight: 600; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 14px;
    padding: 16px 0; font-size: 18px; font-weight: 700; color: #fff;
    -webkit-tap-highlight-color: transparent; transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .yes { background: linear-gradient(135deg, #ff7ad9, #7a5cff); box-shadow: 0 8px 24px rgba(122,92,255,0.35); }
  .no { background: rgba(255,255,255,0.08); color: #c9bfe6; border: 1px solid rgba(255,255,255,0.12); }
  .hidden { display: none !important; }
  .fade { animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .rank-badge { text-align: center; font-size: 64px; margin: 6px 0 4px; }
  .rank-name {
    text-align: center; font-size: 28px; font-weight: 800; margin: 0 0 6px;
    background: linear-gradient(90deg, #ffd27a, #ff7ad9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rank-score { text-align: center; color: #a89cc9; font-size: 14px; margin: 0 0 18px; }
  .rank-text { font-size: 15px; line-height: 1.8; color: #e4dcf8; margin: 0 0 20px; }
  .ladder { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; font-size: 13px; color: #8f83b3; line-height: 2; margin-bottom: 18px; }
  .ladder .now { color: #ffd27a; font-weight: 700; }
  .share { width: 100%; background: linear-gradient(90deg, #ffd27a, #ff7ad9); color: #1a1030; margin-bottom: 10px; }
  .again { width: 100%; background: rgba(255,255,255,0.08); color: #e4dcf8; border: 1px solid rgba(255,255,255,0.15); }
  .tip { text-align: center; font-size: 12px; color: #8f83b3; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">CREATOR AWAKENING</p>
  <h1>AI这轮，你拿到分配权了吗？</h1>
  <p class="sub">AI 时代，有人在用它造东西，有人只是看着别人造。<br>10 道是非题，测出你的位置。每选一个"是"，觉醒 1 次。</p>

  <div id="quiz" class="panel">
    <div class="meta">
      <span id="progress">第 1 / 10 题</span>
      <span>觉醒值 <b id="awake">0</b></span>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <p class="question" id="question"></p>
    <div class="options">
      <button class="yes" id="yes">是</button>
      <button class="no" id="no">否</button>
    </div>
  </div>

  <div id="result" class="panel fade hidden">
    <div class="rank-badge" id="badge"></div>
    <p class="rank-name" id="rankName"></p>
    <p class="rank-score" id="rankScore"></p>
    <p class="rank-text" id="rankText"></p>
    <div class="ladder">
      <div data-lv="god">10 次觉醒　神级造物主</div>
      <div data-lv="creator">8–9 次　创世者</div>
      <div data-lv="maker">5–7 次　造物者</div>
      <div data-lv="apprentice">2–4 次　学徒</div>
      <div data-lv="watcher">0–1 次　旁观者</div>
    </div>
    <button class="share" id="share">生成分享图</button>
    <button class="again" id="again">再测一次</button>
    <p class="tip" id="tip"></p>
  </div>
</div>

<script>
  const QUESTIONS = [
    "你是 OpenAI、Anthropic、DeepSeek、Kimi、Gemini、Grok 其中一家公司的全职员工吗？",
    "你是否用 AI 写过故事、脚本、帖子等创作性文字？",
    "你是否用 AI 生成过图片、视频或音频作品？",
    "你是否用 AI 写过代码，并做出过能运行的东西？",
    "你是否用 AI 做过自己的项目、产品或工具，并公开发布过？",
    "你是否靠 AI 创作的内容获得过收入？",
    "你是否训练、微调或部署过自己的 AI 模型或应用？",
    "你是否在公开平台发布过 AI 辅助创作的内容？",
    "你是否把 AI 融入工作流程，并让产出明显变多？",
    "你是否在过去三个月内，用 AI 完成过一件以前做不到的事？"
  ];

  const LEVELS = [
    { min: 10, key: "god",        badge: "👑", name: "神级造物主",
      text: "你不只是在用 AI，你已经在用 AI 创造新的东西。你属于少数能把想法直接变成作品的人，接下来要做的，是让这些作品被更多人看见。" },
    { min: 8,  key: "creator",    badge: "🌌", name: "创世者",
      text: "你已经跨过了大多数人停留的那一步。从灵感到成品，你能独自完成很长的链路。再多一次公开发布，你就会从创作者变成影响者。" },
    { min: 5,  key: "maker",      badge: "⚡", name: "造物者",
      text: "你手里已经有了一些成型的作品，AI 正在放大你的产出。下一步，选一个你最有感觉的方向，把它做完整、做出去。" },
    { min: 2,  key: "apprentice", badge: "🔮", name: "学徒",
      text: "你已经踏进了门口，知道 AI 能做什么，也开始尝试。不要急着做大，先选一个小项目，用 AI 完整地做完一次，这一步最关键。" },
    { min: 0,  key: "watcher",    badge: "🕯️", name: "旁观者",
      text: "你现在更多是在看别人造东西。但每个造物主都是从第一次尝试开始的。今天就用 AI 做一件小事，比如写一段文字、生成一张图，觉醒就从这里开始。" }
  ];

  const SITE_URL = "https://bitchigga.github.io/ai-distribution-game/";

  let index = 0;
  let awake = 0;
  let currentLevel = null;
  const $ = (id) => document.getElementById(id);

  function renderQuestion() {
    $("progress").textContent = `第 ${index + 1} / ${QUESTIONS.length} 题`;
    $("awake").textContent = awake;
    $("fill").style.width = `${(index / QUESTIONS.length) * 100}%`;
    $("question").textContent = QUESTIONS[index];
    const q = $("quiz");
    q.classList.remove("hidden", "fade");
    void q.offsetWidth;
    q.classList.add("fade");
  }

  function answer(yes) {
    if (yes) awake += 1;
    index += 1;
    if (index >= QUESTIONS.length) showResult();
    else renderQuestion();
  }

  function levelFor(n) {
    return LEVELS.find((l) => n >= l.min);
  }

  function showResult() {
    currentLevel = levelFor(awake);
    $("quiz").classList.add("hidden");
    const r = $("result");
    r.classList.remove("hidden", "fade");
    void r.offsetWidth;
    r.classList.add("fade");
    $("badge").textContent = currentLevel.badge;
    $("rankName").textContent = currentLevel.name;
    $("rankScore").textContent = `觉醒 ${awake} / 10 次`;
    $("rankText").textContent = currentLevel.text;
    $("tip").textContent = "";
    document.querySelectorAll(".ladder > div").forEach((el) => {
      el.classList.toggle("now", el.dataset.lv === currentLevel.key);
    });
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    let line = "";
    for (const ch of text) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = ch;
        y += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, y);
    return y;
  }

  function makeCard() {
    const W = 750, H = 1000;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");

    const bg = ctx.createRadialGradient(W / 2, -100, 50, W / 2, 200, 1100);
    bg.addColorStop(0, "#3a1d6e");
    bg.addColorStop(0.5, "#120b24");
    bg.addColorStop(1, "#07050f");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#b79bff";
    ctx.font = "600 26px sans-serif";
    ctx.fillText("CREATOR AWAKENING", W / 2, 110);

    ctx.fillStyle = "#ffd27a";
    ctx.font = "800 56px sans-serif";
    ctx.fillText("AI这轮，你拿到", W / 2, 200);
    ctx.fillText("分配权了吗？", W / 2, 270);

    ctx.font = "170px sans-serif";
    ctx.fillText(currentLevel.badge, W / 2, 470);

    ctx.fillStyle = "#ff7ad9";
    ctx.font = "800 64px sans-serif";
    ctx.fillText(currentLevel.name, W / 2, 580);

    ctx.fillStyle = "#e4dcf8";
    ctx.font = "500 32px sans-serif";
    ctx.fillText(`觉醒 ${awake} / 10 次`, W / 2, 640);

    ctx.fillStyle = "#d3c8ee";
    ctx.font = "400 28px sans-serif";
    ctx.textAlign = "left";
    wrapText(ctx, currentLevel.text, 80, 720, W - 160, 46);

    ctx.textAlign = "center";
    ctx.fillStyle = "#8f83b3";
    ctx.font = "400 24px sans-serif";
    ctx.fillText("你也来测测 →", W / 2, 920);
    ctx.fillStyle = "#b79bff";
    ctx.font = "500 24px sans-serif";
    ctx.fillText("bitchigga.github.io/ai-distribution-game", W / 2, 960);

    return c;
  }

  function shareCard() {
    const btn = $("share");
    btn.disabled = true;
    const canvas = makeCard();
    canvas.toBlob(async (blob) => {
      btn.disabled = false;
      const file = new File([blob], "ai-allocation.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "AI这轮，你拿到分配权了吗？", text: `我的等级：${currentLevel.name}，来测测你的 →` });
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ai-allocation.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      $("tip").textContent = "分享图已保存，可以发到朋友圈或 X。";
    }, "image/png");
  }

  function restart() {
    index = 0;
    awake = 0;
    $("result").classList.add("hidden");
    renderQuestion();
  }

  $("yes").addEventListener("click", () => answer(true));
  $("no").addEventListener("click", () => answer(false));
  $("share").addEventListener("click", shareCard);
  $("again").addEventListener("click", restart);

  renderQuestion();
</script>
</body>
</html>
